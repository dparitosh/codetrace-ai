name: CodeTrace AI - MCP-Powered Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  schedule:
    # Weekly comprehensive analysis
    - cron: "0 0 * * 0"

jobs:
  mcp-analysis:
    runs-on: ubuntu-latest
    name: MCP Repository Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Start CodeTrace AI MCP Server
        run: |
          # Install dependencies
          pip install -r backend/requirements.txt

          # Start MCP server in background
          cd backend
          python main.py &
          echo $! > mcp_server.pid

          # Wait for server to start
          sleep 10

          # Verify MCP server is running
          curl -f http://localhost:8009/mcp/info || exit 1

      - name: Run MCP-Powered Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python .github/scripts/mcp_analysis.py

      - name: Analyze Pull Request (if PR)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          python .github/scripts/mcp_pr_analysis.py

      - name: Create Automated Issues (if scheduled)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python .github/scripts/mcp_create_issues.py

      - name: Upload Analysis Results
        uses: actions/upload-artifact@v4
        with:
          name: mcp-analysis-results
          path: |
            analysis-report.json
            quality-metrics.json
            recommendations.md

      - name: Comment on PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const analysis = JSON.parse(fs.readFileSync('pr-analysis.json', 'utf8'));
              
              const comment = `
              ## 🤖 CodeTrace AI MCP Analysis
              
              **Repository Analysis Status:** ${analysis.status}
              
              ### 📊 Quality Metrics
              - **Overall Score:** ${analysis.quality_score}/100
              - **Security Issues:** ${analysis.security_issues}
              - **Performance Issues:** ${analysis.performance_issues}
              - **Maintainability:** ${analysis.maintainability}/100
              
              ### 🎯 Key Recommendations
              ${analysis.recommendations.map(rec => `- **${rec.priority}**: ${rec.title}`).join('\n')}
              
              ### 🔍 Changed Files Analysis
              ${analysis.file_changes.map(file => `- \`${file.path}\`: Quality score ${file.quality_score}/100`).join('\n')}
              
              ---
              *Generated by CodeTrace AI MCP Integration*
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('No analysis results found or error:', error);
            }

      - name: Cleanup
        if: always()
        run: |
          # Stop MCP server
          if [ -f backend/mcp_server.pid ]; then
            kill $(cat backend/mcp_server.pid) || true
            rm backend/mcp_server.pid
          fi

  mcp-security-scan:
    runs-on: ubuntu-latest
    name: MCP Security Analysis
    needs: mcp-analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Download Analysis Results
        uses: actions/download-artifact@v4
        with:
          name: mcp-analysis-results

      - name: Security-Focused MCP Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Start MCP server
          cd backend
          python main.py &
          sleep 10

          # Run security-focused analysis
          python ../.github/scripts/mcp_security_analysis.py

      - name: Create Security Report
        run: |
          echo "# 🔒 Security Analysis Report" > security-report.md
          echo "" >> security-report.md
          echo "Generated by CodeTrace AI MCP Integration" >> security-report.md
          echo "" >> security-report.md

          if [ -f security-analysis.json ]; then
            python -c "
            import json
            with open('security-analysis.json') as f:
                data = json.load(f)
            
            print(f'## Security Score: {data.get(\"security_score\", 0)}/100')
            print('')
            print('### Vulnerabilities Found:')
            for vuln in data.get('vulnerabilities', []):
                print(f'- **{vuln[\"severity\"]}**: {vuln[\"description\"]}')
            " >> security-report.md
          fi

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md

  mcp-performance-analysis:
    runs-on: ubuntu-latest
    name: MCP Performance Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Performance Analysis via MCP
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Start MCP server
          cd backend
          python main.py &
          sleep 10

          # Analyze performance patterns
          python ../.github/scripts/mcp_performance_analysis.py

      - name: Generate Performance Report
        run: |
          echo "# ⚡ Performance Analysis Report" > performance-report.md
          echo "" >> performance-report.md

          if [ -f performance-analysis.json ]; then
            python -c "
            import json
            with open('performance-analysis.json') as f:
                data = json.load(f)
            
            print(f'## Performance Score: {data.get(\"performance_score\", 0)}/100')
            print('')
            print('### Optimization Opportunities:')
            for opt in data.get('optimizations', []):
                print(f'- {opt[\"description\"]} (Impact: {opt[\"impact\"]})')
            " >> performance-report.md
          fi

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.md
