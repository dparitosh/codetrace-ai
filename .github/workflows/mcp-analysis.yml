# The removed MCP endpoints cannot support the old automated analysis job.
# Retain this workflow entry as an explicit, read-only local-source audit.
name: Manual source audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest codegraph_core/tests backend/tests -q
